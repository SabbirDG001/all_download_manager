name: Build Windows app

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test the engine
        run: cargo test -p adm-engine

      - name: Build the installer
        working-directory: crates/app
        run: npx --yes @tauri-apps/cli@2 build

      - name: Make the portable folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item target/release/AllDownloadManager.exe portable/
          Copy-Item -Recurse extension portable/extension
          # An empty settings.json next to the program turns on portable mode.
          Set-Content -Path portable/settings.json -Value '{}'

      - name: Write checksums
        shell: pwsh
        run: |
          # SHA-256 of what's shared, so people can check their download.
          $files = @(Get-ChildItem target/release/bundle/nsis/*.exe) + @(Get-Item portable/AllDownloadManager.exe)
          $lines = $files | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name }
          Set-Content -Path SHA256SUMS.txt -Value $lines
          Copy-Item SHA256SUMS.txt target/release/bundle/nsis/
          Copy-Item SHA256SUMS.txt portable/
          Get-Content SHA256SUMS.txt

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AllDownloadManager-setup
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/SHA256SUMS.txt

      - name: Upload portable version
        uses: actions/upload-artifact@v4
        with:
          name: AllDownloadManager-portable
          path: portable/

      - name: Upload browser extension
        uses: actions/upload-artifact@v4
        with:
          name: AllDownloadManager-extension
          path: extension/
