name: Build Windows app

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test the engine
        run: cargo test -p adm-engine

      - name: Build the installer
        working-directory: crates/app
        run: npx --yes @tauri-apps/cli@2 build

      - name: Make the portable folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item target/release/AllDownloadManager.exe portable/
          # An empty settings.json next to the program turns on portable mode.
          Set-Content -Path portable/settings.json -Value '{}'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AllDownloadManager-setup
          path: target/release/bundle/nsis/*.exe

      - name: Upload portable version
        uses: actions/upload-artifact@v4
        with:
          name: AllDownloadManager-portable
          path: portable/
