[package]
name = "adm-engine"
description = "Segmented, resumable download engine for All Download Manager"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "adm_engine"

[[bin]]
name = "adm"
path = "src/bin/adm.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "signal", "sync", "process"] }
tokio-util = "0.7"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
percent-encoding = "2"
dirs = "6"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
suppaftp = { version = "12", features = ["tokio"] }

[dev-dependencies]
tokio = { version = "1", features = ["net"] }
