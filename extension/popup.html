<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>All Download Manager</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/32.png" alt="" width="24" height="24">
    <h1>All Download Manager</h1>
  </header>

  <div id="status" class="status checking">
    <span class="dot"></span><span id="status-text">Checking the app…</span>
  </div>
  <p id="error" class="error" hidden></p>

  <section id="page-video" class="card" hidden>
    <div class="card-text">
      <b>Video on this page</b>
      <span id="page-title" class="muted"></span>
    </div>
    <button id="page-download" class="btn small">Download</button>
  </section>

  <section id="media" hidden>
    <h2>Media found on this page</h2>
    <ul id="media-list"></ul>
  </section>

  <label class="toggle">
    <input type="checkbox" id="catch">
    <span class="switch"></span>
    <span>Catch browser downloads</span>
  </label>
  <p class="hint">When on, files you download go to the app instead of the browser. Right-click a link to send it on demand.</p>

  <label class="toggle">
    <input type="checkbox" id="video-button">
    <span class="switch"></span>
    <span>Show "Download" on videos</span>
  </label>
  <p class="hint">A button appears over videos when you point at them.</p>

  <button id="open" class="btn">Open the app</button>

  <script src="sites.js"></script>
  <script src="popup.js"></script>
</body>
</html>
